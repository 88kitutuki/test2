<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>High Score Tavern｜Tournament Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --wood-dark: #2a1c12;
  --wood-main: #3a2b1f;
  --wood-light: #7a5a3a;
  --gold: #ffd27d;
  --paper: #f3e9d2;
}

body {
  margin: 0;
  background: #141414;
  background-image: radial-gradient(#222 1px, transparent 1px);
  background-size: 4px 4px;
  color: var(--paper);
  font-family: "Noto Serif JP", serif;
}

.wrapper {
  max-width: 820px;
  margin: 80px auto;
  padding: 50px;
  background: var(--wood-main);
  border: 6px solid var(--wood-light);
  box-shadow:
    0 0 0 4px var(--wood-dark),
    0 15px 40px rgba(0,0,0,.8);
}

/* ===== ヒーロー ===== */
.hero {
  text-align: center;
  margin-bottom: 50px;
}

.hero h1 {
  font-family: "Press Start 2P", cursive;
  font-size: 22px;
  color: var(--gold);
  line-height: 1.6;
}

.hero p {
  font-size: 14px;
  opacity: .9;
  margin-top: 20px;
}

/* ===== フォーム ===== */
form {
  display: grid;
  gap: 32px;
}

.section {
  padding: 20px;
  background: rgba(0,0,0,.15);
  border: 2px solid var(--wood-light);
}

.section-title {
  font-family: "Press Start 2P", cursive;
  font-size: 12px;
  color: var(--gold);
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  background: var(--wood-dark);
  border: 2px solid var(--wood-light);
  color: var(--paper);
  font-size: 14px;
  box-sizing: border-box;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

input::placeholder,
textarea::placeholder {
  color: #bfae8a;
}

/* ===== チェック ===== */
.check {
  display: flex;
  gap: 10px;
  font-size: 13px;
}

/* ===== ボタン ===== */
button {
  padding: 16px;
  font-family: "Press Start 2P", cursive;
  font-size: 14px;
  background: linear-gradient(#8b5a2b, #5a3a1e);
  border: 3px solid #d4b36a;
  color: #fff;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.15);
}

/* ===== フッター ===== */
.footer {
  text-align: center;
  margin-top: 40px;
  font-size: 12px;
  opacity: .7;
}
</style>
</head>

<body>

<div class="wrapper">

  <section class="hero">
    <h1>
      HIGH SCORE<br>
      TAVERN
    </h1>
    <p>
      この酒場では、強者の名が記録される。<br>
      大会は一期一会ではない。ここは、集い続ける場所だ。
    </p>
  </section>

  <form>

    <div class="section">
      <div class="section-title">ADVENTURER PROFILE</div>

      <label>プレイヤーネーム</label>
      <input type="text" placeholder="例：LEGOLAS" required>

      <label>使用キャラクター / ビルド</label>
      <input type="text" placeholder="例：ARCHER / DEX型">
    </div>

    <div class="section">
      <div class="section-title">COMMUNITY</div>

      <label>Discord ID</label>
      <input type="text" placeholder="example#1234" required>

      <label>SNS / 配信リンク（任意）</label>
      <input type="url" placeholder="https://">
    </div>

    <div class="section">
      <div class="section-title">PLAY STYLE</div>

      <label>参加スタンス</label>
      <select required>
        <option value="">選択してください</option>
        <option>ガチ競技勢</option>
        <option>エンジョイ勢</option>
        <option>観戦・交流メイン</option>
      </select>

      <label>一言メッセージ</label>
      <textarea placeholder="酒場に残す噂話をひとつ…"></textarea>
    </div>

    <div class="check">
      <input type="checkbox" required>
      <span>コミュニティルールとマナーを理解し、同意します</span>
    </div>

    <button type="submit">JOIN THE TAVERN</button>

  </form>

  <div class="footer">
    © High Score Tavern Community
  </div>

</div>

</body>
</html>
